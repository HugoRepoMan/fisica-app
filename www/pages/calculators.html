<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadoras de Física</title>
    <link rel="stylesheet" href="../css/calculators-menu.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="icon-button" onclick="goBack()">
                <i data-lucide="chevron-left"></i>
            </button>
            <h1 class="title">Calculadoras</h1>
        </header>

        <!-- Descripción -->
        <p class="description">Selecciona una calculadora para resolver problemas de física</p>

        <!-- Lista de Calculadoras -->
        <div class="calculators-grid">
            <!-- Fuerzas y Dinámica -->
            <button class="calculator-card" onclick="openCalculator('unified')">
                <div class="card-content">
                    <div class="icon-circle indigo">
                        <i data-lucide="calculator"></i>
                    </div>
                    <div class="card-info">
                        <h2 class="card-title">Fuerzas y Dinámica</h2>
                        <p class="card-description">
                            Calculadora unificada con plano configurable (horizontal/inclinado), opción de rozamiento y dirección de movimiento
                        </p>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="open-text">
                        Abrir
                        <i data-lucide="arrow-right"></i>
                    </span>
                </div>
            </button>

            <!-- Cinemática -->
            <button class="calculator-card" onclick="openCalculator('kinematics')">
                <div class="card-content">
                    <div class="icon-circle cyan">
                        <i data-lucide="trending-up"></i>
                    </div>
                    <div class="card-info">
                        <h2 class="card-title">Cinemática (MRU y MRUV)</h2>
                        <p class="card-description">
                            Calcula velocidad, distancia, tiempo y aceleración para movimiento rectilíneo uniforme y acelerado
                        </p>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="open-text">
                        Abrir
                        <i data-lucide="arrow-right"></i>
                    </span>
                </div>
            </button>

            <!-- Energía y Trabajo -->
            <button class="calculator-card" onclick="openCalculator('energy')">
                <div class="card-content">
                    <div class="icon-circle yellow">
                        <i data-lucide="zap"></i>
                    </div>
                    <div class="card-info">
                        <h2 class="card-title">Energía y Trabajo</h2>
                        <p class="card-description">
                            Calcula energía cinética, energía potencial gravitatoria y trabajo mecánico
                        </p>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="open-text">
                        Abrir
                        <i data-lucide="arrow-right"></i>
                    </span>
                </div>
            </button>

            <!-- Impulso y Momentum -->
            <button class="calculator-card" onclick="openCalculator('momentum')">
                <div class="card-content">
                    <div class="icon-circle emerald">
                        <i data-lucide="target"></i>
                    </div>
                    <div class="card-info">
                        <h2 class="card-title">Impulso y Momentum</h2>
                        <p class="card-description">
                            Calcula momentum lineal, impulso y analiza colisiones inelásticas
                        </p>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="open-text">
                        Abrir
                        <i data-lucide="arrow-right"></i>
                    </span>
                </div>
            </button>
        </div>
    </div>

    <script src="../cordova.js"></script>
    <script src="../js/controllers/calculators-menu.js"></script>
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
