<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemática</title>
    <link rel="stylesheet" href="../css/calculator-shared.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="icon-btn" onclick="goBack()">
                <i data-lucide="chevron-left"></i>
            </button>
            <h1 class="title">Cinemática</h1>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="setMode('mru')">MRU</button>
            <button class="tab" onclick="setMode('mruv')">MRUV</button>
        </div>

        <div class="main-card">
            <div class="formula-section">
                <div>
                    <p class="formula-label">Fórmula</p>
                    <p class="formula-text" id="formula">v = d / t</p>
                </div>
                <div class="formula-icon cyan">
                    <i data-lucide="trending-up"></i>
                </div>
            </div>

            <div id="mruInputs">
                <div class="input-group">
                    <label>Velocidad (m/s)</label>
                    <input type="number" id="velocity" step="0.01" placeholder="ej. 20">
                </div>
                <div class="input-group">
                    <label>Distancia (m)</label>
                    <input type="number" id="distance" step="0.01" placeholder="ej. 100">
                </div>
                <div class="input-group">
                    <label>Tiempo (s)</label>
                    <input type="number" id="time" step="0.01" placeholder="ej. 5">
                </div>
            </div>

            <div id="mruvInputs" class="hidden">
                <div class="input-group">
                    <label>Velocidad inicial (m/s)</label>
                    <input type="number" id="v0" step="0.01" placeholder="ej. 0">
                </div>
                <div class="input-group">
                    <label>Velocidad final (m/s)</label>
                    <input type="number" id="vf" step="0.01" placeholder="ej. 20">
                </div>
                <div class="input-group">
                    <label>Aceleración (m/s²)</label>
                    <input type="number" id="acceleration" step="0.01" placeholder="ej. 2">
                </div>
                <div class="input-group">
                    <label>Distancia (m)</label>
                    <input type="number" id="distance2" step="0.01" placeholder="ej. 100">
                </div>
                <div class="input-group">
                    <label>Tiempo (s)</label>
                    <input type="number" id="time2" step="0.01" placeholder="ej. 10">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary cyan" onclick="calculate()">
                    <i data-lucide="calculator"></i>
                    Calcular
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <i data-lucide="x"></i>
                    Limpiar
                </button>
            </div>
        </div>

        <div id="results" class="results-card hidden"></div>
    </div>

    <script src="../cordova.js"></script>
    <script src="../js/calculator-kinematics.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
